<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tea Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Фонове зображення -->
        <img
            class="background"
            src="123.png"
            alt=""
        >

        <!-- Верхній туман -->
        <div class="fog-top"></div>


        <!-- Заголовок -->
        <header class="header">

            <h1>
                Скільки ви випили чаю?
            </h1>

            <p>
                дізнайтесь це на нашому сайті
            </p>

        </header>


        <!-- Кнопка день / ніч -->
        <button
            class="theme-button"
            id="themeButton"
            type="button"
        >
            ☀️
        </button>


        <!-- Погода -->
        <section class="weather-card">

            <div class="weather-top">

                <span class="weather-title">
                    Погода зараз
                </span>

                <span
                    class="weather-status"
                    id="weatherStatus"
                >
                    ...
                </span>

            </div>


            <div class="weather-main">

                <div
                    class="weather-icon"
                    id="weatherIcon"
                >
                    🌤️
                </div>

                <div class="weather-temperature">

                    <span id="weatherTemperature">
                        --
                    </span>

                    <small>°C</small>

                </div>

            </div>


            <div class="weather-bottom">

                <span
                    class="weather-city"
                    id="weatherCity"
                >
                    Завантаження...
                </span>

                <span
                    class="weather-description"
                    id="weatherText"
                >
                    Отримання погоди
                </span>

            </div>

        </section>


        <!-- Об'єм чашки -->
        <div class="cup-volume">

            <label for="cupVolume">
                Об'єм чашки:
            </label>

            <div class="volume-input">

                <input
                    type="number"
                    id="cupVolume"
                    min="1"
                    step="1"
                    value="250"
                >

                <select id="volumeUnit">

                    <option value="ml">
                        мл
                    </option>

                    <option value="l">
                        л
                    </option>

                </select>

            </div>

        </div>


        <!-- Головна кнопка -->
        <button
            class="main-button"
            id="teaButton"
            type="button"
        >

            Випито чаю за день:

            <span id="teaCount">
                0 мл
            </span>

        </button>


        <!-- Чашка -->
        <div class="tea-cup">
            ☕
        </div>


        <!-- Статистика -->
        <section class="statistics">

            <h2>
                Статистика чаю
            </h2>


            <div class="statistics-grid">

                <!-- Місяць -->
                <div class="stat-card">

                    <div class="stat-icon">
                        📅
                    </div>

                    <div class="stat-title">
                        За місяць
                    </div>

                    <div
                        class="stat-value"
                        id="monthStat"
                    >
                        0 мл
                    </div>

                </div>


                <!-- 6 місяців -->
                <div class="stat-card">

                    <div class="stat-icon">
                        📊
                    </div>

                    <div class="stat-title">
                        За 6 місяців
                    </div>

                    <div
                        class="stat-value"
                        id="sixMonthsStat"
                    >
                        0 мл
                    </div>

                </div>


                <!-- Рік -->
                <div class="stat-card">

                    <div class="stat-icon">
                        📈
                    </div>

                    <div class="stat-title">
                        За рік
                    </div>

                    <div
                        class="stat-value"
                        id="yearStat"
                    >
                        0 мл
                    </div>

                </div>

            </div>

        </section>


        <!-- Сніг -->
        <div
            class="snow"
            id="snow"
        ></div>


        <!-- Дощ -->
        <div
            class="rain"
            id="rain"
        ></div>


        <!-- Нижній туман -->
        <div class="fog-bottom"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
