<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tea Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Фонове зображення -->
        <img
            class="background"
            src="123.png"
            alt=""
        >

        <!-- Верхній туман -->
        <div class="fog-top"></div>


        <!-- Заголовок -->
        <header class="header">

            <h1>
                Скільки ви випили чаю?
            </h1>

            <p>
                дізнайтесь це на нашому сайті
            </p>

        </header>


        <!-- Кнопка перемикання теми -->
        <button
            class="theme-button"
            id="themeButton"
            type="button"
        >
            ☀️
        </button>


        <!-- Погода -->
        <section class="weather">

            <span
                class="weather-icon"
                id="weatherIcon"
            >
                🌤️
            </span>

            <span
                class="weather-text"
                id="weatherText"
            >
                Завантаження погоди...
            </span>

        </section>
         <!-- Чашка чаю -->
        <div class="tea-cup">
            ☕
        </div>


        <!-- Об'єм чашки -->
        <div class="cup-volume">

            <label for="cupVolume">
                Об'єм чашки:
            </label>

            <div class="volume-input">

                <input
                    type="number"
                    id="cupVolume"
                    min="1"
                    step="1"
                    value="250"
                >

                <select id="volumeUnit">

                    <option value="ml">
                        мл
                    </option>

                    <option value="l">
                        л
                    </option>

                </select>

            </div>

        </div>


        <!-- Головна кнопка -->
        <button
            class="main-button"
            id="teaButton"
            type="button"
        >

            Випито чаю за день:

            <span id="teaCount">
                0 мл
            </span>

        </button>


        <!-- Сніг -->
        <div
            class="snow"
            id="snow"
        ></div>


        <!-- Дощ -->
        <div
            class="rain"
            id="rain"
        ></div>


        <!-- Нижній туман -->
        <div class="fog-bottom"></div>

        
       

    </main>
    


    <script src="script.js"></script>

    
       
</body>

</html>
